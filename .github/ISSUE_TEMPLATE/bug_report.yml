name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Please **remove project names, client names and any confidential information** from screenshots and text before posting.
  - type: dropdown
    id: revit
    attributes:
      label: Revit version
      options:
        - "2022"
        - "2023"
        - "2024"
        - "2025"
        - "2026"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in the Trial info button
      placeholder: "0.9.0.0"
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Connect
        - Split
        - Space
        - Trace
        - Align
        - Export to Excel
        - Import from Excel
        - Copy Views
        - Copy Schedules
        - Copy Families
        - Panel Schedules / Sync Names
        - Ribbon Tabs
        - Colors / Row Wrap
        - Contextual panel
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Select ...\n2. Click ...\n3. ..."
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: Paste the text of the Revit error window, if there was one.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs (optional)
      description: Drag files here. Logs are in your %TEMP% folder (opentabs_*_log.txt) — attach them only if asked.
